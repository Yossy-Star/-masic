<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Z Magic POV RED BLACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
#camera-video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0;}
#fx-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none;}
.ctrl-btn{
  position:fixed;z-index:10000;width:54px;height:54px;border:none;border-radius:14px;
  background:rgba(0,0,0,0.55);color:#fff;font-size:24px;backdrop-filter:blur(8px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
#ss-btn{left:10px;bottom:10px;}
#rec-btn{left:74px;bottom:10px;}
#full-btn{right:10px;top:10px;}
#rec-btn.recording{background:rgba(180,0,0,0.8);animation:recPulse 1s infinite;}
@keyframes recPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
#log{
  position:fixed;left:0;bottom:0;width:100%;max-height:32vh;overflow:auto;
  background:rgba(0,0,0,0.5);color:#ff6666;font-size:12px;font-family:monospace;
  padding:10px;z-index:9999;pointer-events:none;
}
#flash{position:fixed;inset:0;background:#ff2200;opacity:0;pointer-events:none;z-index:40000;}
</style>
</head>
<body>

<video id="camera-video" autoplay playsinline muted></video>
<canvas id="fx-canvas"></canvas>
<button id="ss-btn" class="ctrl-btn">📷</button>
<button id="rec-btn" class="ctrl-btn">🎥</button>
<button id="full-btn" class="ctrl-btn">⛶</button>
<div id="log"></div>
<div id="flash"></div>

<script>
/* =========================================
   LOG
========================================= */
const logEl=document.getElementById("log");
function log(msg,color){
  const d=document.createElement("div");
  d.textContent="["+new Date().toTimeString().slice(0,8)+"] "+msg;
  d.style.color=color||"#ff6666";
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}

/* =========================================
   CAMERA
========================================= */
const video=document.getElementById("camera-video");
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})
.then(s=>{video.srcObject=s;log("camera started","#ff9999");})
.catch(e=>{log("camera error: "+e.message,"#ff4444");});

/* =========================================
   CANVAS
========================================= */
const canvas=document.getElementById("fx-canvas");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();
window.addEventListener("resize",resize);

/* =========================================
   COLORS  赤×黒
========================================= */
// 炎の色グラデーション: 黒→暗赤→赤→オレンジ先端
const FIRE_COLORS=[
  [10,0,0],
  [80,5,0],
  [180,20,0],
  [240,60,0],
  [255,120,10],
  [255,200,80],
];
function fireColor(t){// t: 0=根元(暗) 1=先端(明)
  const i=Math.min(t*(FIRE_COLORS.length-1),FIRE_COLORS.length-1.001);
  const lo=Math.floor(i),hi=lo+1,f=i-lo;
  const a=FIRE_COLORS[lo],b=FIRE_COLORS[hi];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function fireRGBA(t,a){const c=fireColor(t);return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}

/* =========================================
   EMBER POOL (軽量炎パーティクル)
========================================= */
const MAX_EMBERS=200;
const embers=[];
function spawnEmber(x,y,intensity){
  if(embers.length>=MAX_EMBERS) return;
  const ang=-Math.PI/2+(Math.random()-0.5)*1.2;
  const spd=1.5+Math.random()*intensity;
  embers.push({
    x,y,
    vx:Math.cos(ang)*spd*(Math.random()<0.5?1:-1)*0.4,
    vy:-Math.abs(Math.sin(ang)*spd),
    life:0.6+Math.random()*0.6,
    size:1+Math.random()*2.5,
    t:0.3+Math.random()*0.7,
  });
}
function updateEmbers(){
  for(let i=embers.length-1;i>=0;i--){
    const p=embers[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.97; p.vy*=0.97;
    p.vy-=0.04;// 炎は上へ
    p.life-=0.03;
    if(p.life<=0){embers.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=p.life*0.85;
    ctx.fillStyle=fireRGBA(p.t,1);
    ctx.shadowColor=fireRGBA(p.t,0.8);
    ctx.shadowBlur=4;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

/* =========================================
   GLOW CIRCLE (炎ベース)
========================================= */
function drawFireGlow(x,y,r,a){
  // 外輪: 暗赤
  ctx.beginPath();ctx.arc(x,y,r*4,0,Math.PI*2);
  ctx.fillStyle=`rgba(60,0,0,${a*0.15})`;ctx.fill();
  // 中輪: 赤
  ctx.beginPath();ctx.arc(x,y,r*2,0,Math.PI*2);
  ctx.fillStyle=`rgba(200,30,0,${a*0.35})`;ctx.fill();
  // 芯: オレンジ白
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,160,40,${a})`;ctx.fill();
  // ハイライト
  ctx.beginPath();ctx.arc(x,y,r*0.4,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,240,200,${a*0.9})`;ctx.fill();
}

/* =========================================
   CHARRED Z LINE
   炭でかすれた描画: セグメント分割+ランダムオフセット+不透明度ゆらぎ
========================================= */
const LINE_SPEED=0.018;
const CHAR_SEGS=28;// 分割数

function makeCharredLine(x1,y1,x2,y2){
  // オフセットを事前生成（毎フレーム再生成しない→軽量）
  const offsets=[];
  for(let i=0;i<=CHAR_SEGS;i++){
    offsets.push({
      dx:(Math.random()-0.5)*6,
      dy:(Math.random()-0.5)*6,
      alpha:0.55+Math.random()*0.45,
    });
  }
  return{x1,y1,x2,y2,t:0,done:false,offsets,
    embers:Array.from({length:60},()=>({life:0})),
    eHead:0};
}

function emitLineEmber(line,x,y){
  const sp=line.embers[line.eHead%line.embers.length];
  line.eHead++;
  const ang=Math.random()*Math.PI*2;
  const spd=1+Math.random()*5;
  sp.x=x; sp.y=y;
  sp.vx=Math.cos(ang)*spd; sp.vy=Math.sin(ang)*spd-2;
  sp.life=0.6+Math.random()*0.5;
  sp.size=1+Math.random()*2;
  sp.t=0.5+Math.random()*0.5;
}

function drawCharredPath(line,tx,ty){
  const {x1,y1,x2,y2,offsets}=line;
  const dx=tx-x1, dy=ty-y1;

  // レイヤー1: 暗い太い下地（木炭の芯）
  ctx.beginPath();
  for(let i=0;i<=CHAR_SEGS;i++){
    const seg_t=i/CHAR_SEGS;
    const bx=x1+dx*seg_t, by=y1+dy*seg_t;
    const ox=offsets[i].dx*0.5, oy=offsets[i].dy*0.5;
    i===0 ? ctx.moveTo(bx+ox,by+oy) : ctx.lineTo(bx+ox,by+oy);
  }
  ctx.lineWidth=14;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="rgba(5,0,0,0.9)";ctx.stroke();

  // レイヤー2: 赤い炎の芯
  ctx.beginPath();
  for(let i=0;i<=CHAR_SEGS;i++){
    const seg_t=i/CHAR_SEGS;
    const bx=x1+dx*seg_t, by=y1+dy*seg_t;
    const {dx:ox,dy:oy,alpha:a}=offsets[i];
    i===0 ? ctx.moveTo(bx+ox,by+oy) : ctx.lineTo(bx+ox,by+oy);
  }
  ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="rgba(200,20,0,0.85)";ctx.stroke();

  // レイヤー3: かすれた明るい炎線（断続）
  for(let i=0;i<CHAR_SEGS;i++){
    if(Math.random()>0.55) continue;// 断続してかすれ感
    const seg_t=i/CHAR_SEGS;
    const nx_t=(i+1)/CHAR_SEGS;
    const ax=x1+dx*seg_t+offsets[i].dx, ay=y1+dy*seg_t+offsets[i].dy;
    const bx=x1+dx*nx_t+offsets[i+1].dx, by_=y1+dy*nx_t+offsets[i+1].dy;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by_);
    ctx.lineWidth=1.5+Math.random()*1.5;
    ctx.strokeStyle=`rgba(255,${80+Math.random()*80|0},0,${offsets[i].alpha*0.8})`;
    ctx.stroke();
  }

  // 先端グロー
  drawFireGlow(tx,ty,8,0.95);
}

let magicLines=[];

function updateLine(line){
  if(!line.done){
    line.t+=LINE_SPEED*(1+line.t*1.2);
    if(line.t>=1){line.t=1;line.done=true;}
  }
  const tx=line.x1+(line.x2-line.x1)*line.t;
  const ty=line.y1+(line.y2-line.y1)*line.t;

  // 先端から炎エンバー
  for(let i=0;i<3;i++) emitLineEmber(line,tx,ty);

  drawCharredPath(line,tx,ty);

  // ラインエンバー更新
  for(const sp of line.embers){
    if(sp.life<=0) continue;
    sp.x+=sp.vx; sp.y+=sp.vy;
    sp.vx*=0.93; sp.vy*=0.93; sp.vy-=0.05;
    sp.life-=0.04;
    if(sp.life<=0) continue;
    ctx.save();
    ctx.globalAlpha=sp.life*0.8;
    ctx.fillStyle=fireRGBA(sp.t,1);
    ctx.beginPath();ctx.arc(sp.x,sp.y,sp.size*sp.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

/* =========================================
   Z GESTURE
========================================= */
let gestureStep=0, lastStepTime=0;
const STEP_TIMEOUT=2200;

function createZStep(step){
  const W=canvas.width,H=canvas.height;
  const lx=W*0.28,rx=W*0.72,ty=H*0.34,by=H*0.66;
  if(step===1) magicLines.push(makeCharredLine(lx,ty,rx,ty));
  if(step===2) magicLines.push(makeCharredLine(rx,ty,lx,by));
  if(step===3) magicLines.push(makeCharredLine(lx,by,rx,by));
}

/* =========================================
   PROJECTILE
   弧を描きながら奥へ飛ぶ
========================================= */
let projectile=null;
const projParticles=[];

function launchProjectile(){
  const W=canvas.width,H=canvas.height;

  projectile={
    startX:W*0.5,
    startY:H*0.62,

    x:W*0.5,
    y:H*0.62,

    // 終点
    endX:W*0.78,
    endY:H*0.22,

    // 放物線の高さ
    arcHeight:H*0.22,

    t:0,
    scale:1.0,
    alive:true,
    trail:[],
  };

  log("PROJECTILE launched (arc)","#ff9999");
}

function spawnProjParticle(x,y,scale){
  if(projParticles.length>120) return;

  const ang=Math.random()*Math.PI*2;
  const spd=(1+Math.random()*3)*scale;

  projParticles.push({
    x,y,
    vx:Math.cos(ang)*spd,
    vy:Math.sin(ang)*spd,
    life:0.5+Math.random()*0.5,
    size:(1+Math.random()*2)*scale,
    t:0.4+Math.random()*0.6,
  });
}

function updateProjectile(){

  if(projectile && projectile.alive){

    // 進行度
    projectile.t += 0.018;

    if(projectile.t >= 1){
      projectile.alive=false;

      for(let i=0;i<40;i++){
        spawnProjParticle(projectile.x,projectile.y,0.4);
      }

      flashScreen();
      return;
    }

    const t=projectile.t;

    // =====================================
    // 位置補間
    // =====================================

    // 横移動
    projectile.x =
      projectile.startX +
      (projectile.endX - projectile.startX) * t;

    // 縦移動 + 放物線
    const baseY =
      projectile.startY +
      (projectile.endY - projectile.startY) * t;

    // sinで弧を作る
    projectile.y =
      baseY -
      Math.sin(t * Math.PI) * projectile.arcHeight;

    // =====================================
    // 奥方向スケール
    // =====================================
    projectile.scale = 1 - t * 0.92;

    const sc=projectile.scale;
    const r=22*sc;

    // トレイル
    projectile.trail.push({
      x:projectile.x,
      y:projectile.y,
      sc
    });

    if(projectile.trail.length>22){
      projectile.trail.shift();
    }

    // 描画
    for(let i=0;i<projectile.trail.length;i++){

      const p=projectile.trail[i];
      const a=(i/projectile.trail.length)*0.45;

      ctx.save();
      ctx.globalAlpha=a;

      ctx.beginPath();
      ctx.arc(p.x,p.y,16*p.sc,0,Math.PI*2);

      ctx.fillStyle=fireRGBA(0.7,1);
      ctx.fill();

      ctx.restore();
    }

    // 本体
    drawFireGlow(projectile.x,projectile.y,r,0.95);

    // 炎
    for(let i=0;i<3;i++){
      spawnEmber(
        projectile.x+(Math.random()-0.5)*r*2,
        projectile.y+(Math.random()-0.5)*r*2,
        2*sc
      );
    }
  }

  // 爆発粒子
  for(let i=projParticles.length-1;i>=0;i--){

    const p=projParticles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vx*=0.94;
    p.vy*=0.94;

    p.life-=0.025;

    if(p.life<=0){
      projParticles.splice(i,1);
      continue;
    }

    ctx.save();

    ctx.globalAlpha=p.life;
    ctx.fillStyle=fireRGBA(p.t,1);

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);

    ctx.fill();

    ctx.restore();
  }
}

/* =========================================
   COMPLETE MAGIC
========================================= */
function completeMagic(){
  log("Z MAGIC COMPLETE","#ff4444");
  launchProjectile();
}

/* =========================================
   MOTION
========================================= */
function handleMotion(e){
  const now=Date.now();
  if(gestureStep!==0 && now-lastStepTime>STEP_TIMEOUT){
    gestureStep=0;magicLines=[];log("timeout","#ffaa44");
  }
  const acc=e.accelerationIncludingGravity;
  if(!acc) return;
  const x=acc.x||0,y=acc.y||0;
  if(gestureStep===0 && x>12 && Math.abs(x)>Math.abs(y)){
    gestureStep=1;lastStepTime=now;createZStep(1);log("STEP1","#ff6666");
  }else if(gestureStep===1 && x<-10 && y>10){
    gestureStep=2;lastStepTime=now;createZStep(2);log("STEP2","#ff6666");
  }else if(gestureStep===2 && x>12 && Math.abs(x)>Math.abs(y)){
    gestureStep=3;lastStepTime=now;createZStep(3);log("STEP3","#ff6666");
    completeMagic();
  }
}

function requestMotionPermission(){
  if(typeof DeviceMotionEvent!=="undefined" &&
     typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission()
    .then(s=>{
      if(s==="granted"){
        window.addEventListener("devicemotion",handleMotion);
        log("motion granted","#ff9999");
      }
    }).catch(e=>{log("motion error: "+e.message,"#ff4444");});
  }else{
    window.addEventListener("devicemotion",handleMotion);
    log("motion registered","#ff9999");
  }
}

let requested=false;
document.addEventListener("touchstart",()=>{
  if(!requested){requested=true;requestMotionPermission();}
},{passive:true});
requestMotionPermission();

/* =========================================
   DRAW LOOP
========================================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  magicLines=magicLines.filter(line=>{
    if(!line.done) return true;
    return line.embers.some(sp=>sp.life>0);
  });
  for(const line of magicLines) updateLine(line);

  updateEmbers();
  updateProjectile();

  requestAnimationFrame(draw);
}
draw();

/* =========================================
   FLASH
========================================= */
function flashScreen(){
  const f=document.getElementById("flash");
  f.style.transition="none";f.style.opacity="0.85";
  requestAnimationFrame(()=>{f.style.transition="opacity 0.5s";f.style.opacity="0";});
}

/* =========================================
   UTIL
========================================= */
function nowString(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"
    +p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}

/* =========================================
   SCREENSHOT
========================================= */
async function captureComposite(){
  return new Promise(resolve=>{
    const comp=document.createElement("canvas");
    comp.width=window.innerWidth;comp.height=window.innerHeight;
    const c=comp.getContext("2d");
    if(video.readyState>=2){
      const vw=video.videoWidth,vh=video.videoHeight;
      const sc=Math.max(comp.width/vw,comp.height/vh);
      c.drawImage(video,(comp.width-vw*sc)/2,(comp.height-vh*sc)/2,vw*sc,vh*sc);
    }
    c.drawImage(canvas,0,0);
    comp.toBlob(b=>resolve(b),"image/png");
  });
}
document.getElementById("ss-btn").addEventListener("click",async()=>{
  const blob=await captureComposite();
  downloadBlob(blob,"ss_"+nowString()+".png");
  log("screenshot saved","#ffdd55");
});

/* =========================================
   RECORDING
========================================= */
const recBtn=document.getElementById("rec-btn");
let isRecording=false,mediaRecorder,chunks=[],recCanvas,recCtx,recRAF;

function drawRec(){
  if(!isRecording) return;
  if(video.readyState>=2){
    const vw=video.videoWidth,vh=video.videoHeight;
    const sc=Math.max(recCanvas.width/vw,recCanvas.height/vh);
    recCtx.drawImage(video,(recCanvas.width-vw*sc)/2,(recCanvas.height-vh*sc)/2,vw*sc,vh*sc);
  }
  recCtx.drawImage(canvas,0,0);
  recRAF=requestAnimationFrame(drawRec);
}

async function startRecording(){
  recCanvas=document.createElement("canvas");
  recCanvas.width=window.innerWidth;recCanvas.height=window.innerHeight;
  recCtx=recCanvas.getContext("2d");
  const stream=recCanvas.captureStream(30);
  mediaRecorder=new MediaRecorder(stream,{mimeType:"video/webm"});
  chunks=[];
  mediaRecorder.ondataavailable=e=>{if(e.data?.size>0) chunks.push(e.data);};
  mediaRecorder.onstop=()=>{
    downloadBlob(new Blob(chunks,{type:"video/webm"}),"video_"+nowString()+".webm");
    log("record saved","#ffdd55");
  };
  isRecording=true;recBtn.classList.add("recording");
  mediaRecorder.start(200);drawRec();log("record start","#ff6666");
}

function stopRecording(){
  isRecording=false;cancelAnimationFrame(recRAF);
  if(mediaRecorder?.state!=="inactive") mediaRecorder.stop();
  recBtn.classList.remove("recording");log("record stop","#ff9999");
}

recBtn.addEventListener("click",()=>{isRecording?stopRecording():startRecording();});

/* =========================================
   FULLSCREEN
========================================= */
document.getElementById("full-btn").addEventListener("click",()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen()
    .catch(e=>log("FS: "+e.message,"#ff4444"));
});
</script>
</body>
</html>
