<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Control</title>

  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #status {
      position: fixed;
      bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <button onclick="send()">曲送り</button>

  <div id="status"></div>

  <script>
    // 初回だけWebhook URLを入力
    let WEBHOOK = localStorage.getItem("hook");

    if (!WEBHOOK) {
      WEBHOOK = prompt("MacroDroidのWebhook URLを入力してください");

      if (WEBHOOK) {
        localStorage.setItem("hook", WEBHOOK);
      }
    }

    async function send() {

      if (!WEBHOOK) {
        alert("Webhook URLが設定されていません");
        return;
      }

      try {

        const response = await fetch(WEBHOOK, {
          method: "POST"
        });

        document.getElementById("status").textContent =
          "送信成功";

      } catch (e) {

        document.getElementById("status").textContent =
          "送信失敗";
      }
    }
  </script>

</body>
</html>
