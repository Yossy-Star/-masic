<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Light Trail Camera</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
}

#camera-video {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  object-fit: cover;
  z-index: 0;
}

#trail-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 1;
  pointer-events: none;
}

#light-point {
  position: fixed;
  z-index: 2;
  width: 28px;
  height: 28px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  cursor: pointer;
  background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0.8) 35%, rgba(255,255,255,0) 70%);
  box-shadow:
    0 0 8px 4px rgba(255,255,255,0.9),
    0 0 20px 8px rgba(180,220,255,0.6),
    0 0 40px 16px rgba(120,180,255,0.3);
  animation: pulse 2s ease-in-out infinite;
  transition: background 0.3s, box-shadow 0.3s;
}

#light-point.locked {
  background: radial-gradient(circle, #fff 0%, rgba(255,80,80,0.9) 35%, rgba(255,60,60,0) 70%);
  box-shadow:
    0 0 8px 4px rgba(255,80,80,0.95),
    0 0 20px 8px rgba(255,80,80,0.65),
    0 0 40px 16px rgba(200,40,40,0.35);
  animation: pulse-red 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.75; transform: translate(-50%, -50%) scale(1.15); }
}

@keyframes pulse-red {
  0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
}

/* ==============================
   ログ
============================== */
#log {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  max-height: 35vh;
  overflow-y: auto;
  background: rgba(0,0,0,0.7);
  color: #00ff88;
  font-family: monospace;
  font-size: 12px;
  padding: 8px 10px;
  z-index: 9999;
  pointer-events: none;
}

/* ==============================
   ボタン共通
============================== */
.ctrl-btn {
  position: fixed;
  z-index: 10000;
  background: rgba(0,0,0,0.65);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 8px;
  width: 48px; height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-family: monospace;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.ctrl-btn:active { background: rgba(255,255,255,0.15); }
.ctrl-btn:disabled { opacity: 0.5; cursor: default; }

#ss-btn  { left: 10px; bottom: 10px; }
#rec-btn { left: 70px; bottom: 10px; }
#full-btn { right: 10px; top: 10px; }

#rec-btn.recording {
  background: rgba(180,0,0,0.75);
  border-color: #ff4444;
  animation: rec-pulse 1.2s ease-in-out infinite;
}
@keyframes rec-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

#mic-badge {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 16px; height: 16px;
  font-size: 10px;
  border-radius: 50%;
}
#mic-badge.on  { background: rgba(0,200,100,0.35); color: #afffcc; }
#mic-badge.off { background: rgba(255,80,80,0.3);  color: #ffaaaa; }

/* ==============================
   カウントダウン
============================== */
#countdown-overlay {
  display: none;
  position: fixed; inset: 0;
  z-index: 20000;
  align-items: center; justify-content: center;
  background: transparent;
  pointer-events: none;
}
#countdown-overlay.active { display: flex; }
#countdown-num {
  font-size: clamp(80px, 25vw, 160px);
  font-family: monospace; font-weight: 900;
  color: #fff;
  text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 2px 6px rgba(0,0,0,0.9);
  line-height: 1;
  animation: pop 0.4s ease-out;
}
@keyframes pop {
  0%   { transform: scale(1.6); opacity: 0; }
  60%  { transform: scale(0.95); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* フラッシュ */
#ss-flash {
  display: none; position: fixed; inset: 0;
  z-index: 30000; background: #fff; pointer-events: none;
}
#ss-flash.active {
  display: block;
  animation: flash-anim 0.35s ease-out forwards;
}
@keyframes flash-anim {
  0% { opacity: 1; } 100% { opacity: 0; }
}
</style>
</head>
<body>

<video id="camera-video" autoplay playsinline muted></video>
<canvas id="trail-canvas"></canvas>
<div id="light-point"></div>

<div id="log"></div>

<button id="full-btn" class="ctrl-btn">⛶</button>
<button id="ss-btn"   class="ctrl-btn">📷</button>
<button id="rec-btn"  class="ctrl-btn">
  🎥<span id="mic-badge" class="off">🎙</span>
</button>

<div id="countdown-overlay"><div id="countdown-num">3</div></div>
<div id="ss-flash"></div>

<script>
/* =========================
   ログ
========================= */
const logEl = document.getElementById("log");
function log(msg, color) {
  const time = new Date().toTimeString().slice(0,8);
  const line = document.createElement("div");
  line.style.color = color || "#00ff88";
  line.textContent = "[" + time + "] " + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}
window.onerror = (msg, url, line) => log("JS ERROR: " + msg + " line:" + line, "#ff5555");
window.addEventListener("load", () => log("window loaded"));

/* =========================
   カメラ起動
========================= */
const video = document.getElementById("camera-video");

navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
  audio: false
}).then(stream => {
  video.srcObject = stream;
  log("カメラ起動 OK", "#88ffcc");
}).catch(err => {
  log("カメラエラー: " + err.message, "#ff5555");
});

/* =========================
   軌跡キャンバス & ジャイロ
========================= */
const canvas = document.getElementById("trail-canvas");
const ctx    = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

/* 軌跡ポイント管理 */
let trailPoints = [];
let trailLocked = false;       // ロックON=軌跡を消さない
let lastOrientation = null;    // { alpha, beta, gamma }

/* 累積スクリーン座標（ジャイロ積分） */
let posX = window.innerWidth  / 2;
let posY = window.innerHeight / 2;

const SENSITIVITY = 4.0;       // 感度
const FADE_TIME   = 500;       // フェードアウト時間 (ms)

/* ジャイロイベント */
function handleOrientation(e) {
  if (lastOrientation === null) {
    lastOrientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
    return;
  }

  const dGamma = (e.gamma - lastOrientation.gamma) || 0; // 左右
  const dBeta  = (e.beta  - lastOrientation.beta)  || 0; // 上下

  lastOrientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };

  const W = canvas.width;
  const H = canvas.height;

  posX = Math.max(0, Math.min(W, posX + dGamma * SENSITIVITY));
  posY = Math.max(0, Math.min(H, posY + dBeta  * SENSITIVITY));

  trailPoints.push({ x: posX, y: posY, t: Date.now(), locked: trailLocked });
}

/* iOS permission request */
function requestGyroPermission() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          log("ジャイロ許可 OK", "#afffcc");
        } else {
          log("ジャイロ拒否", "#ff5555");
        }
      })
      .catch(err => log("ジャイロ許可エラー: " + err.message, "#ff5555"));
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    log("ジャイロ登録 (no permission API)", "#88ffcc");
  }
}

/* 最初のタップでパーミッション要求 */
let gyroRequested = false;
document.addEventListener("touchstart", () => {
  if (!gyroRequested) { gyroRequested = true; requestGyroPermission(); }
}, { passive: true });
requestGyroPermission(); // デスクトップ向け即時登録

/* =========================
   描画ループ
========================= */
function drawTrail() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const now = Date.now();

  /* 古い非ロックポイントを削除 */
  trailPoints = trailPoints.filter(p => p.locked || (now - p.t) < FADE_TIME + 200);

  if (trailPoints.length < 2) {
    requestAnimationFrame(drawTrail);
    return;
  }

  /* セグメントごとに描画 */
  for (let i = 1; i < trailPoints.length; i++) {
    const p0 = trailPoints[i - 1];
    const p1 = trailPoints[i];

    /* ロックが混在するセグメントは描かない */
    if (p0.locked !== p1.locked) continue;

    let alpha;
    if (p1.locked) {
      alpha = 0.85;
    } else {
      const age = now - p1.t;
      alpha = Math.max(0, 1 - age / FADE_TIME);
    }

    if (alpha <= 0) continue;

    const color = p1.locked ? `rgba(255,60,60,${alpha})` : `rgba(255,255,255,${alpha})`;
    const glowColor = p1.locked ? `rgba(255,80,80,${alpha * 0.4})` : `rgba(150,200,255,${alpha * 0.4})`;

    /* グロー（太め・薄め） */
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.strokeStyle = glowColor;
    ctx.lineWidth   = 8;
    ctx.lineCap     = "round";
    ctx.stroke();

    /* コア（細め・不透明） */
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2;
    ctx.lineCap     = "round";
    ctx.stroke();
  }

  requestAnimationFrame(drawTrail);
}
drawTrail();

/* =========================
   光の点 タップ = ロック切替
========================= */
const lightPoint = document.getElementById("light-point");

lightPoint.addEventListener("click", e => {
  e.stopPropagation();
  trailLocked = !trailLocked;

  if (trailLocked) {
    lightPoint.classList.add("locked");
    /* 現在のポイントを全部ロック済みにマーク */
    trailPoints.forEach(p => { p.locked = true; });
    log("軌跡ロック ON（タップで解除）", "#ff8888");
  } else {
    lightPoint.classList.remove("locked");
    /* ロック解除: 既存ロックポイントをクリア */
    trailPoints = [];
    log("軌跡ロック OFF", "#88ffcc");
  }
});

/* =========================
   共通ユーティリティ
========================= */
const countdownOverlay = document.getElementById("countdown-overlay");
const countdownNum     = document.getElementById("countdown-num");
const ssFlash          = document.getElementById("ss-flash");

const UI_SELECTORS = ["#log", "#ss-btn", "#rec-btn", "#full-btn"];

function setUIVisible(visible) {
  UI_SELECTORS.forEach(sel => {
    const el = document.querySelector(sel);
    if (el) el.style.visibility = visible ? "visible" : "hidden";
  });
}

function countdown(seconds) {
  return new Promise(resolve => {
    countdownNum.textContent = seconds;
    countdownOverlay.classList.add("active");
    let remaining = seconds;
    const tick = () => {
      remaining--;
      if (remaining <= 0) { countdownOverlay.classList.remove("active"); resolve(); return; }
      countdownNum.textContent = remaining;
      countdownNum.style.animation = "none";
      void countdownNum.offsetWidth;
      countdownNum.style.animation = "";
      setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);
  });
}

function doFlash() {
  return new Promise(resolve => {
    ssFlash.classList.remove("active");
    void ssFlash.offsetWidth;
    ssFlash.classList.add("active");
    ssFlash.addEventListener("animationend", () => { ssFlash.classList.remove("active"); resolve(); }, { once: true });
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a   = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function nowString() {
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  return now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + "_"
       + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
}

/* =========================
   合成キャプチャ（video + canvas）
========================= */
function captureComposite() {
  return new Promise((resolve, reject) => {
    try {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const comp = document.createElement("canvas");
      comp.width = W; comp.height = H;
      const c = comp.getContext("2d");
      if (video.readyState >= 2) {
        const vW = video.videoWidth, vH = video.videoHeight;
        const scale = Math.max(W/vW, H/vH);
        const dw = vW*scale, dh = vH*scale;
        c.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);
      }
      c.drawImage(canvas, 0, 0, W, H);
      comp.toBlob(blob => blob ? resolve(blob) : reject(new Error("toBlob null")), "image/png");
    } catch(err) { reject(err); }
  });
}

/* =========================
   📷 スクリーンショット
========================= */
const ssBtn = document.getElementById("ss-btn");

async function takeScreenshot() {
  ssBtn.disabled = true;
  log("SS: countdown start", "#88ccff");
  setUIVisible(false);
  await countdown(3);
  try {
    const [blob] = await Promise.all([captureComposite(), doFlash()]);
    downloadBlob(blob, "screenshot_" + nowString() + ".png");
    log("SS: saved", "#ffdd55");
  } catch(err) {
    log("SS: failed — " + err.message, "#ff5555");
  }
  setUIVisible(true);
  ssBtn.disabled = false;
}

ssBtn.addEventListener("click", takeScreenshot);

/* =========================
   🎥 録画（ボタンでのみ開始/停止）
========================= */
const recBtn   = document.getElementById("rec-btn");
const micBadge = document.getElementById("mic-badge");

let isRecording    = false;
let mediaRecorder  = null;
let recordedChunks = [];
let recCanvas      = null;
let recCtx         = null;
let rafRecId       = null;
let micStream      = null;

function drawRecFrame() {
  if (!isRecording) return;
  const W = recCanvas.width, H = recCanvas.height;
  recCtx.clearRect(0, 0, W, H);
  if (video.readyState >= 2) {
    const vW = video.videoWidth, vH = video.videoHeight;
    const scale = Math.max(W/vW, H/vH);
    const dw = vW*scale, dh = vH*scale;
    recCtx.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);
  }
  recCtx.drawImage(canvas, 0, 0, W, H);
  rafRecId = requestAnimationFrame(drawRecFrame);
}

function stopRecording() {
  if (!isRecording) return;
  log("REC: stopping…", "#88ccff");
  isRecording = false;
  if (rafRecId !== null) { cancelAnimationFrame(rafRecId); rafRecId = null; }
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  recBtn.classList.remove("recording");
  recBtn.disabled = false;
  setUIVisible(true);
}

async function startRecording() {
  if (isRecording) return;
  recBtn.disabled = true;
  log("REC: countdown start", "#88ccff");
  setUIVisible(false);
  await countdown(3);

  /* マイク */
  let audioTracks = [];
  try {
    micStream   = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioTracks = micStream.getAudioTracks();
    log("REC: mic OK — " + (audioTracks[0]?.label || "unknown"), "#afffcc");
  } catch(err) {
    log("REC: mic unavailable — " + err.message, "#ffaa44");
    micStream = null;
  }

  const W = window.innerWidth, H = window.innerHeight;
  recCanvas        = document.createElement("canvas");
  recCanvas.width  = W;
  recCanvas.height = H;
  recCtx           = recCanvas.getContext("2d");

  const fps         = 30;
  const videoStream = recCanvas.captureStream(fps);
  audioTracks.forEach(t => videoStream.addTrack(t));

  micBadge.textContent = audioTracks.length ? "🎙 ON" : "🎙 OFF";
  micBadge.className   = audioTracks.length ? "on" : "off";

  const mimeTypes = [
    "video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus",
    "video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"
  ];
  let mimeType = "";
  for (const mt of mimeTypes) { if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; } }

  try {
    mediaRecorder = new MediaRecorder(videoStream, mimeType ? { mimeType } : {});
  } catch(err) {
    log("REC: MediaRecorder init failed — " + err.message, "#ff5555");
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    setUIVisible(true);
    recBtn.disabled = false;
    return;
  }

  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const ext  = mimeType.includes("mp4") ? "mp4" : "webm";
    const blob = new Blob(recordedChunks, { type: mimeType || "video/webm" });
    const fn   = "video_" + nowString() + "." + ext;
    downloadBlob(blob, fn);
    log("REC: saved → " + fn + " (" + (blob.size/1024).toFixed(1) + " KB)", "#ffdd55");
    recordedChunks = [];
  };
  mediaRecorder.onerror = e => { log("REC: error — " + e.error, "#ff5555"); stopRecording(); };

  isRecording = true;
  mediaRecorder.start(200);
  drawRecFrame();

  recBtn.classList.add("recording");
  recBtn.disabled = false;
  setUIVisible(true);

  log("REC: started " + W + "×" + H + " @" + fps + "fps  codec=" + (mimeType || "default") + "  audio=" + (audioTracks.length > 0), "#ff8844");
}

recBtn.addEventListener("click", () => {
  if (isRecording) stopRecording();
  else             startRecording();
});

/* =========================
   ⛶ 全画面
========================= */
const fullBtn = document.getElementById("full-btn");

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement);
}
function requestFullscreen(el) {
  return el.requestFullscreen?.() || el.webkitRequestFullscreen?.() ||
         el.mozRequestFullScreen?.() || el.msRequestFullscreen?.();
}
function exitFullscreen() {
  return document.exitFullscreen?.() || document.webkitExitFullscreen?.() ||
         document.mozCancelFullScreen?.() || document.msExitFullscreen?.();
}

fullBtn.addEventListener("click", () => {
  if (isFullscreen()) exitFullscreen().catch(e => log("FS exit failed: " + e.message, "#ff5555"));
  else requestFullscreen(document.documentElement).catch(e => log("FS enter failed: " + e.message, "#ff5555"));
});

["fullscreenchange","webkitfullscreenchange","mozfullscreenchange","MSFullscreenChange"].forEach(ev => {
  document.addEventListener(ev, () => log("FS: " + (isFullscreen() ? "entered" : "exited"), "#88ccff"));
});
</script>
</body>
</html>
